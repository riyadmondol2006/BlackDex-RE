name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release when a v* tag is pushed

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Set these in: repo Settings → Secrets and variables → Actions → Secrets.
      #   KEYSTORE_BASE64   base64 of your release keystore  (base64 -w0 release.jks | pbcopy)
      #   KEYSTORE_PASSWORD store password
      #   KEY_ALIAS         key alias
      #   KEY_PASSWORD      key password
      # If they are absent (e.g. a fork), the release APK is built unsigned instead of failing.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Don't let the action install its default 'tools' package: Google removed it from the
          # SDK repository, so `sdkmanager tools` fails with exit 1. We install what we need below.
          packages: ""

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BLACKDEX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        env:
          BLACKDEX_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          BLACKDEX_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          BLACKDEX_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      # The release version is the app's real versionName/versionCode, read straight from
      # app/build.gradle so releases always match what the APK reports. A short build suffix
      # (<versionCode>.<run number>) keeps each push's tag unique and ordered.
      - name: Read app version
        id: ver
        run: |
          name=$(sed -nE 's/.*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n1)
          code=$(sed -nE 's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n1)
          [ -n "$name" ] || { echo "could not parse versionName"; exit 1; }
          [ -n "$code" ] || { echo "could not parse versionCode"; exit 1; }
          full="${name}+${code}.${GITHUB_RUN_NUMBER}"
          # Git tags can't contain '+', so use a tag-safe form.
          tag="v${name}-${code}.${GITHUB_RUN_NUMBER}"
          {
            echo "name=$name"
            echo "code=$code"
            echo "full=$full"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "App version: $name ($code) -> release $full, tag $tag"

      - name: Collect & rename APKs
        id: apks
        env:
          VER: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p dist
          sha="${GITHUB_SHA::7}"
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] && cp "$f" "dist/BlackDex-RE-${VER}-debug-${sha}.apk"
          done
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            case "$f" in
              *unsigned*) cp "$f" "dist/BlackDex-RE-${VER}-release-unsigned-${sha}.apk" ;;
              *)          cp "$f" "dist/BlackDex-RE-${VER}-release-${sha}.apk" ;;
            esac
          done
          ls -l dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-RE-debug
          path: dist/*debug*.apk
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-RE-release
          path: dist/*release*.apk
          if-no-files-found: ignore

      # Every push to the default branch cuts a fresh release into the Releases tab, versioned
      # with the app's real versionName (e.g. v4.0.0-RE-7.12), carrying the APKs built above.
      # (PRs and feature-branch pushes do NOT create releases.)
      - name: Publish per-push Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: BlackDex RE ${{ steps.ver.outputs.name }}
          body: |
            **BlackDex RE ${{ steps.ver.outputs.name }}**

            Automated build of `main` @ ${{ github.sha }}.
            APKs attached below. The `release` APK is signed when repo signing secrets are set, otherwise it is `release-unsigned`.
          prerelease: false
          make_latest: true
          files: dist/*.apk

      # A pushed v* tag cuts a full (non-prerelease) versioned release with generated notes.
      - name: Publish tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
