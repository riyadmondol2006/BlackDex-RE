name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release when a v* tag is pushed

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Set these in: repo Settings → Secrets and variables → Actions → Secrets.
      #   KEYSTORE_BASE64   base64 of your release keystore  (base64 -w0 release.jks | pbcopy)
      #   KEYSTORE_PASSWORD store password
      #   KEY_ALIAS         key alias
      #   KEY_PASSWORD      key password
      # If they are absent (e.g. a fork), the release APK is built unsigned instead of failing.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Don't let the action install its default 'tools' package: Google removed it from the
          # SDK repository, so `sdkmanager tools` fails with exit 1. We install what we need below.
          packages: ""

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BLACKDEX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        env:
          BLACKDEX_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          BLACKDEX_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          BLACKDEX_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect & rename APKs
        id: apks
        run: |
          mkdir -p dist
          sha="${GITHUB_SHA::7}"
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] && cp "$f" "dist/BlackDex-RE-4.0.0-RE-debug-${sha}.apk"
          done
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            case "$f" in
              *unsigned*) cp "$f" "dist/BlackDex-RE-4.0.0-RE-release-unsigned-${sha}.apk" ;;
              *)          cp "$f" "dist/BlackDex-RE-4.0.0-RE-release-${sha}.apk" ;;
            esac
          done
          ls -l dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-RE-debug
          path: dist/*debug*.apk
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-RE-release
          path: dist/*release*.apk
          if-no-files-found: ignore

      # Every push to the default branch cuts a fresh prerelease into the Releases tab,
      # tagged build-<run number>, carrying the APKs built above. (PRs and feature-branch
      # pushes do NOT create releases.)
      - name: Publish per-push Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Automated build of `main` @ ${{ github.sha }}.
            APKs attached below. The `release` APK is signed when repo signing secrets are set, otherwise it is `release-unsigned`.
          prerelease: false
          make_latest: true
          files: dist/*.apk

      # A pushed v* tag cuts a full (non-prerelease) versioned release with generated notes.
      - name: Publish tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
