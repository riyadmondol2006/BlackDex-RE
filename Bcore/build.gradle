apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'
    compileSdk rootProject.ext.compileSdk
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdk

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            // Universal: both 32-bit and 64-bit ARM in a single artifact.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('./src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'UnusedResources', 'RestrictedApi', 'NewApi', 'InlinedApi'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Hidden-API unsealing. FreeReflection keeps the me.weishu.reflection package.
    implementation 'com.github.tiann:FreeReflection:3.1.0'
    // Robust hidden-API bypass for Android 9-15+ (API 28-35+).
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation project(':Bcore:black-hook')
    implementation project(':Bcore:black-fake')
}
